<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Review</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">Chess Review</span>
  <span class="row">
    <button id="statsBtn" class="ghost">สถิติจุดอ่อน</button>
    <button id="backBtn" class="ghost" hidden>กลับ</button>
  </span>
</header>

<main>
  <!-- View 1: choose a game -->
  <section id="loaderView">
    <div class="card">
      <h2>โหลดเกมจาก chess.com</h2>
      <form id="userForm" class="row">
        <input id="username" type="text" placeholder="username ของ chess.com" autocomplete="off" spellcheck="false">
        <button type="submit">โหลดเกม</button>
      </form>
      <div id="listTools" class="row list-tools" hidden>
        <label>ผล
          <select id="filterResult">
            <option value="all">ทั้งหมด</option>
            <option value="win">ชนะ</option>
            <option value="loss">แพ้</option>
            <option value="draw">เสมอ</option>
          </select>
        </label>
        <label>สีที่เล่น
          <select id="filterColour">
            <option value="all">ทั้งหมด</option>
            <option value="w">ขาว</option>
            <option value="b">ดำ</option>
          </select>
        </label>
      </div>
      <p id="loadStatus" class="status" role="status"></p>
      <ul id="gameList" class="game-list"></ul>
      <button id="olderBtn" type="button" class="ghost older-btn" hidden>โหลดเดือนก่อนหน้า</button>
      <div id="batchBox" hidden>
        <button id="batchBtn" type="button" class="older-btn">วิเคราะห์ทุกเกมในรายการ</button>
        <p id="batchStatus" class="status" role="status"></p>
      </div>
    </div>

    <details class="card">
      <summary>หรือวาง PGN เอง</summary>
      <textarea id="pgnInput" rows="8" placeholder="วาง PGN ของเกมที่นี่" spellcheck="false"></textarea>
      <div class="row">
        <button id="pgnBtn" type="button">เปิดเกมนี้</button>
      </div>
      <p id="pgnStatus" class="status" role="status"></p>
    </details>
  </section>

  <!-- View 3: statistics across all analysed games -->
  <section id="statsView" hidden>
    <div class="card">
      <h2>สถิติจุดอ่อนจากเกมที่วิเคราะห์แล้ว</h2>
      <p id="statsStatus" class="status" role="status"></p>
      <div id="statsTiles" class="tiles"></div>
    </div>
    <div class="card" id="statsFocusCard" hidden>
      <h2>ควรแก้เรื่องนี้ก่อน</h2>
      <div id="statsFocus" class="focus"></div>
    </div>
    <div class="card" id="statsCatCard" hidden>
      <h2>ประเภทข้อผิดพลาดของคุณ</h2>
      <p class="note">กดที่แถวเพื่อดูตัวอย่างจากเกมจริง แล้วกดตัวอย่างเพื่อเปิดไปที่ตานั้น</p>
      <div id="statsCats"></div>
    </div>
    <div class="card" id="statsMoreCard" hidden>
      <h2>พลาดช่วงไหนของเกม</h2>
      <table class="summary" id="statsPhases"></table>
      <h2 class="sub">เวลาที่ใช้คิด</h2>
      <p id="statsTime" class="move-detail"></p>
      <p id="statsNote" class="note"></p>
    </div>
  </section>

  <!-- View 2: step through a game -->
  <section id="reviewView" hidden>
    <div class="board-col">
      <div class="player" id="playerTop">
        <span class="player-name"></span>
        <span class="player-clock"></span>
      </div>
      <div class="board-wrap">
        <div id="evalBar" class="eval-bar" hidden>
          <div id="evalFill" class="eval-fill"></div>
          <span id="evalText" class="eval-text"></span>
        </div>
        <div id="board" class="board" aria-label="กระดานหมากรุก"></div>
      </div>
      <div class="player" id="playerBottom">
        <span class="player-name"></span>
        <span class="player-clock"></span>
      </div>
      <div class="nav-block">
      <div class="controls">
        <button id="firstBtn" type="button" aria-label="ไปตาแรก" title="ไปตาแรก (Home)">&laquo;</button>
        <button id="prevBtn" type="button" aria-label="ตาก่อนหน้า" title="ตาก่อนหน้า (ลูกศรซ้าย)">&lsaquo;</button>
        <button id="nextBtn" type="button" aria-label="ตาถัดไป" title="ตาถัดไป (ลูกศรขวา)">&rsaquo;</button>
        <button id="lastBtn" type="button" aria-label="ไปตาสุดท้าย" title="ไปตาสุดท้าย (End)">&raquo;</button>
        <button id="flipBtn" type="button" class="ghost" title="กลับด้านกระดาน (F)">กลับด้าน</button>
      </div>
      <div class="row mistake-nav">
        <button id="prevMistakeBtn" type="button" class="ghost" disabled>ข้อผิดพลาดก่อนหน้า</button>
        <button id="nextMistakeBtn" type="button" class="ghost" disabled>ข้อผิดพลาดถัดไป</button>
      </div>
      </div>
      <div class="card move-card">
        <div id="moveStatus" class="move-status"></div>
        <div id="moveDetail" class="move-detail"></div>
      </div>
    </div>

    <div class="side-col">
      <div class="card">
        <div id="gameInfo" class="game-info"></div>
      </div>

      <div class="card" id="analysisCard">
        <div id="progressBox">
          <div id="progressText" class="status"></div>
          <div class="progress"><div id="progressFill" class="progress-fill"></div></div>
        </div>
        <div id="summaryBox" hidden>
          <table class="summary">
            <thead><tr><th></th><th id="sumWhiteName"></th><th id="sumBlackName"></th></tr></thead>
            <tbody id="summaryBody"></tbody>
          </table>
          <svg id="evalGraph" class="eval-graph" preserveAspectRatio="none" role="img"
               aria-label="กราฟโอกาสชนะของขาวตลอดเกม"></svg>
          <p id="analysisNote" class="note"></p>
        </div>
      </div>
      <div class="card moves-card">
        <ol id="moveList" class="move-list"></ol>
      </div>
    </div>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
